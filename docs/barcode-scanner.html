<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KasirPro Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#07111f;color:#fff}body{display:flex;align-items:center;justify-content:center;padding:14px}.shell{width:min(720px,100%);background:#101b2d;border:1px solid #263750;border-radius:20px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35)}.head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #263750}.head b{font-size:17px}.close{border:0;background:#24334b;color:#fff;border-radius:9px;padding:8px 12px}.stage{position:relative;background:#000;aspect-ratio:16/9;overflow:hidden}.stage #reader{width:100%;height:100%}.stage video{width:100%!important;height:100%!important;object-fit:cover}.scanline{position:absolute;left:8%;right:8%;top:50%;height:3px;background:#27e6a1;box-shadow:0 0 12px #27e6a1,0 0 28px rgba(39,230,161,.75);animation:scanline 1.55s ease-in-out infinite;z-index:10;pointer-events:none}.corners{position:absolute;inset:16%;border:2px solid rgba(255,255,255,.7);border-radius:12px;z-index:9;pointer-events:none}.corners:before,.corners:after{content:"";position:absolute;inset:-2px;border-radius:12px;border:2px solid transparent}.corners:before{border-top-color:#27e6a1;border-bottom-color:#27e6a1;animation:pulse 1s ease-in-out infinite}.status{padding:12px 16px;background:#0c1626;color:#d6deea;min-height:48px}.status.ok{color:#6ff0b8}.status.err{color:#ff9a9a}.status.warn{color:#ffd27d}.foot{padding:12px 16px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.foot small{color:#93a4bd}.btn{border:1px solid #344a68;background:#17263d;color:#fff;border-radius:9px;padding:9px 12px}.btn.primary{background:#1d6cff;border-color:#1d6cff}@keyframes scanline{0%,100%{transform:translateY(-95px);opacity:.55}50%{transform:translateY(95px);opacity:1}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(max-width:650px){body{padding:0}.shell{width:100%;min-height:100vh;border-radius:0}.stage{aspect-ratio:9/16;max-height:78vh}.corners{inset:22% 8%}.scanline{left:10%;right:10%}.head{padding-top:calc(12px + env(safe-area-inset-top))}.foot{padding-bottom:calc(12px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<main class="shell"><header class="head"><b>KasirPro — Scan Barcode</b><button class="close" id="close">Tutup</button></header><section class="stage"><div id="reader"></div><div class="corners"></div><div class="scanline"></div></section><div id="status" class="status">Menyiapkan kamera…</div><footer class="foot"><small id="mode">Mode: Kasir</small><button class="btn" id="switch" hidden>Ganti kamera</button></footer></main>
<script>
(function(){'use strict';
const p=new URLSearchParams(location.search),mode=p.get('mode')==='product'?'product':'pos',nonce=p.get('nonce')||'',opener=window.opener;const formats=['EAN_13','EAN_8','UPC_A','UPC_E','CODE_128','CODE_39','ITF','QR_CODE'];const cfg={fps:15,aspectRatio:16/9,disableFlip:true,qrbox:(w,h)=>{const z=Math.floor(Math.min(w,h)*.68);return{width:z,height:z}},formatsToSupport:formats.map(x=>window.Html5QrcodeSupportedFormats&&window.Html5QrcodeSupportedFormats[x]).filter(x=>x!=null)};let scanner=null,cameras=[],idx=0,last='',lastAt=0,closed=false;const st=document.getElementById('status');document.getElementById('mode').textContent='Mode: '+(mode==='product'?'Produk':'Kasir');function status(t,c){st.textContent=t;st.className='status '+(c||'')}function norm(v){return String(v==null?'':v).trim().replace(/\s+/g,'')}function rear(a){return(a||[]).find(c=>/back|rear|environment|belakang/i.test(String(c.label||'')))}function mobile(){return/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'')}async function stop(){if(scanner){const s=scanner;scanner=null;try{await s.stop()}catch(e){}try{s.clear()}catch(e){}}}async function start(camera){await stop();if(closed)return;scanner=new Html5Qrcode('reader');await scanner.start(camera,cfg,deliver,()=>{});status('Arahkan barcode ke garis pemindai…','ok')}async function choose(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Perangkat tidak menyediakan kamera yang dapat diakses browser.');if(mobile()){try{await start({facingMode:{exact:'environment'}});return}catch(e){}try{await start({facingMode:'environment'});return}catch(e){}}cameras=await Html5Qrcode.getCameras();if(!cameras.length)throw new Error('Tidak ada kamera yang tersedia.');const preferred=mobile()?rear(cameras):cameras[0];idx=preferred?Math.max(0,cameras.findIndex(c=>c.id===preferred.id)):0;await start(cameras[idx].id);document.getElementById('switch').hidden=cameras.length<2}function deliver(raw){const code=norm(raw),now=Date.now();if(!code||code===last&&now-lastAt<900)return;last=code;lastAt=now;status('Barcode terbaca: '+code,'ok');if(opener&&!opener.closed){opener.postMessage({type:'KASIRPRO_BARCODE_SCAN',nonce,mode,barcode:code,format:'auto'},'*');setTimeout(()=>window.close(),220)}else status('Jendela KasirPro tidak ditemukan. Buka scanner dari KasirPro.','warn')}document.getElementById('switch').onclick=async()=>{if(!cameras.length)return;idx=(idx+1)%cameras.length;try{await start(cameras[idx].id)}catch(e){status('Gagal mengganti kamera: '+(e.message||e),'err')}};document.getElementById('close').onclick=()=>{closed=true;stop().finally(()=>window.close())};window.addEventListener('beforeunload',()=>{closed=true;stop()});(async()=>{if(!opener){status('Scanner harus dibuka dari KasirPro.','err');return}if(!window.isSecureContext){status('Scanner kamera memerlukan HTTPS.','err');return}try{await choose()}catch(e){status('Kamera tidak dapat digunakan: '+(e&&e.message||e),'err')}})();
})();
</script>
</body></html>
